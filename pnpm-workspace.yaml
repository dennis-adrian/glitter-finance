  # every transitive consumer resolve the same postcss.
  postcss: 8.5.26

overrides:
  fast-uri: 3.1.5
  "minimatch@>=10>brace-expansion": 5.0.9
  nanoid: 3.3.18
  postcss: "catalog:"
