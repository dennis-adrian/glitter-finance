allowBuilds:
  "@journeyapps/wa-sqlite": true
  "@sentry/cli": true
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true

catalog:
  # Shared by the direct devDependency and the override below, so the app and
  # every transitive consumer resolve the same postcss.
  postcss: 8.5.26

overrides:
  fast-uri: 3.1.9
  "minimatch@>=10>brace-expansion": 5.0.12
  nanoid: 3.3.18
  postcss: "catalog:"
  # @serwist/turbopack and @serwist/build 9.5.13 pin zod 4.6.5 exactly
  # (GHSA-mrhx-c7xc-m3w5, fixed in 4.6.6). Drop once Serwist moves past it.
  "zod@>=4.0.0 <4.6.6": 4.6.7
