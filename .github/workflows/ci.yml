name: CI

on:
  pull_request:
  push:
    branches: [main, develop, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, lint, test, format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the pnpm version pinned by `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      # Run every check even when an earlier one fails, so a single run
      # reports all problems.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The runner image ships the PostgreSQL server binaries, off PATH.
      # scripts/test-db.ts builds its own throwaway cluster with them: every
      # migration, every supabase/manual file (twice) and the seed.
      - name: Find the PostgreSQL binaries
        run: |
          pg_bin="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)"
          test -x "$pg_bin/initdb"
          "$pg_bin/postgres" --version
          echo "PG_BIN=$pg_bin" >> "$GITHUB_ENV"

      - name: Database tests
        run: pnpm test:db
